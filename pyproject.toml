[project]
name = "autodev"
version = "0.1.0"
description = "autodev using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai,tools]>=1.15.28,<2.0.0",
    "fastapi>=0.161.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
autodev = "autodev.main:run"
run_crew = "autodev.main:run"
train = "autodev.main:train"
replay = "autodev.main:replay"
test = "autodev.main:test"
run_with_trigger = "autodev.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "6e9f0a10-ee91-4a08-a38d-020f1bff9678"
